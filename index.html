<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanul's Web</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #05070a;
    height: 100%;
    overflow: hidden;
  }

  #loader {
    position: fixed;
    inset: 0;
    background: #05070a;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: opacity 0.6s ease;
  }

  #loader.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #loaderCanvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #loaderCenter {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.4rem;
    text-align: center;
    padding: 0 1.5rem;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  #loaderMark {
    font-size: clamp(1.1rem, 2.6vw, 1.6rem);
    letter-spacing: 0.35em;
    color: #DFD0B8;
    text-transform: uppercase;
    opacity: 0.9;
  }

  #loaderStatus {
    font-size: 0.85rem;
    color: #948979;
    min-height: 1.2em;
    letter-spacing: 0.05em;
  }

  #loaderBarTrack {
    width: min(60vw, 320px);
    height: 2px;
    background: rgba(148, 137, 121, 0.25);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  #loaderBarFill {
    position: absolute;
    inset: 0;
    width: 0%;
    background: linear-gradient(90deg, #948979, #DFD0B8);
    box-shadow: 0 0 12px rgba(223, 208, 184, 0.6);
    transition: width 0.25s ease-out;
  }

  #loaderHint {
    font-size: 0.7rem;
    color: #4B4038;
    letter-spacing: 0.08em;
  }

  @media (prefers-reduced-motion: reduce) {
    #loader { transition: opacity 0.2s linear; }
  }
</style>
</head>
<body>

  <!-- ============ SPLASH LOADING SCREEN ============ -->
  <!-- Halaman ini HANYA splash. Setelah animasi selesai,
       otomatis pindah ke home.html. -->
  <div id="loader">
    <canvas id="loaderCanvas"></canvas>
    <div id="loaderCenter">
      <div id="loaderMark">SANUL&nbsp;&middot;&nbsp;AEROSPACE</div>
      <div id="loaderBarTrack"><div id="loaderBarFill"></div></div>
      <div id="loaderStatus">Menyalakan mesin&hellip;</div>
      <div id="loaderHint">klik di mana saja untuk mempercepat lompatan</div>
    </div>
  </div>

  <script>
    (function() {
      const DESTINATION = 'home.html';

      const loader = document.getElementById('loader');
      const canvas = document.getElementById('loaderCanvas');
      const ctx = canvas.getContext('2d');
      const barFill = document.getElementById('loaderBarFill');
      const statusEl = document.getElementById('loaderStatus');

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      let W, H, cx, cy;
      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        cx = W / 2;
        cy = H / 2;
      }
      resize();
      window.addEventListener('resize', resize);

      const messages = [
        'Menyalakan mesin…',
        'Mengkalibrasi navigasi…',
        'Mengunci koordinat…',
        'Melompat ke hyperspace…'
      ];

      const STAR_COUNT = 260;
      let stars = [];

      function makeStar() {
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * Math.max(W, H) * 0.6 + 20;
        return {
          angle,
          baseRadius: radius,
          speed: Math.random() * 0.6 + 0.3,
          size: Math.random() * 1.6 + 0.6,
          hue: Math.random() * 40 + 40
        };
      }

      function initStars() {
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) stars.push(makeStar());
      }
      initStars();

      let progress = 0;
      let warpBoost = 0;
      let launched = false;
      let msgIndex = 0;

      function setStatus(i) {
        if (i !== msgIndex && i < messages.length) {
          msgIndex = i;
          statusEl.textContent = messages[i];
        }
      }

      loader.addEventListener('click', () => {
        warpBoost = Math.min(warpBoost + 0.35, 1.2);
      });

      function draw() {
        ctx.clearRect(0, 0, W, H);
        const pull = Math.min(progress + warpBoost, 1);

        stars.forEach(s => {
          const r = s.baseRadius * (1 - pull) + 2;
          s.angle += 0.0015 * s.speed * (1 + pull * 6);

          const x = cx + Math.cos(s.angle) * r;
          const y = cy + Math.sin(s.angle) * r;

          const streak = pull * 18 * s.speed;
          const tailX = cx + Math.cos(s.angle - 0.02) * (r + streak);
          const tailY = cy + Math.sin(s.angle - 0.02) * (r + streak);

          ctx.strokeStyle = `hsla(${s.hue}, 100%, 90%, ${0.15 + pull * 0.5})`;
          ctx.lineWidth = s.size;
          ctx.beginPath();
          ctx.moveTo(tailX, tailY);
          ctx.lineTo(x, y);
          ctx.stroke();
        });

        const glowR = 4 + pull * 60;
        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowR);
        grad.addColorStop(0, `rgba(223, 208, 184, ${0.5 * pull})`);
        grad.addColorStop(1, 'rgba(223, 208, 184, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
        ctx.fill();

        warpBoost *= 0.96;
      }

      function animateLoader() {
        if (launched) return;
        draw();
        requestAnimationFrame(animateLoader);
      }

      if (reduceMotion) {
        canvas.style.display = 'none';
      } else {
        animateLoader();
      }

      const MIN_DURATION = 1800;
      const start = performance.now();

      function tick() {
        const elapsed = performance.now() - start;
        progress = Math.min(elapsed / MIN_DURATION, 1);

        barFill.style.width = (progress * 100).toFixed(0) + '%';
        setStatus(Math.min(messages.length - 1, Math.floor(progress * messages.length)));

        if (progress >= 1 && !launched) {
          launched = true;
          finishAndRedirect();
          return;
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      function finishAndRedirect() {
        setStatus(messages.length - 1);
        barFill.style.width = '100%';
        setTimeout(() => {
          loader.classList.add('hidden');
          // Navigasi SETELAH fade-out selesai, bukan bersamaan,
          // supaya home.html mulai dari layar yang benar-benar bersih
          // dan cursor.js di sana tidak rebutan dengan transisi ini.
          setTimeout(() => {
            window.location.href = DESTINATION;
          }, 650);
        }, 250);
      }
    })();
  </script>

</body>
</html>
